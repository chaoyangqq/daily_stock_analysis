# A股与港股中短线波段交易四步闭环策略 / Swing Closed-Loop Strategy
# 融合：大盘定仓位 -> 主线定方向 -> 标的触发条件单 -> 持仓动态风控

name: swing_closed_loop
display_name: 中短线波段四步闭环策略
description: 专为A股/港股波段与趋势交易打造（持仓数天至数周），严格执行四步决策闭环，生成量化触发条件与止损预案。
category: trend
core_rules: [1, 2, 3, 4, 6]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
  - get_sector_rankings
aliases: [波段策略, 四步闭环, 波段交易计划]
default_active: true
default_router: true
default_priority: 1
market_regimes: [trending_up, oscillating, neutral, sideways]

instructions: |
  **【中短线波段交易四步闭环决策系统】**

  用户当前真实持仓及成本底表（分析以下标的时必须关联成本价与仓位进行专属诊断）：
  1. 电力ETF广发 (159611)：持仓 26,000 份，成本价 0.9467 元（盈利保护状态）。重点给出【移动止盈保护线】和持仓趋势延续研判。
  2. 有色ETF汇添富 (159652)：持仓 10,000 份，成本价 1.5287 元（盈利保护状态）。重点跟踪上方阻力位与锁定利润点位。
  3. 科创创新药ETF汇添富 (589120)：持仓 10,000 份，成本价 0.8415 元（微幅浮亏）。重点研判均线支撑位止跌信号及防守底线。
  4. 西部矿业 (601168)：持仓 600 股，成本价 38.7495 元（微幅浮亏）。重点结合有色工业金属行业景气研判回踩支撑与加仓/减仓触发点。
  5. 海康威视 (002415)：持仓 1,300 股，成本价 35.7635 元（微幅浮亏）。重点跟踪 34~35 元平台支撑有效性与反弹减亏机会。

  其他自选标的为【重点观察池】（博众精工 688097、华工科技 000988、京仪装备 688652、中粮科技 000930、翱捷科技-U 688220、凯莱英 002821、半导体ETF鹏华 159813、柏诚股份 601133、松发股份 603268、卫星ETF永赢 159206、西部材料 002149、工业有色ETF万家 560860、证券保险ETF 515630、青岛啤酒 600600、华润三九 000999、大位科技 600589）。对观察池标的重点输出【买入触发条件单】。

  ### Step 1: 大盘环境与仓位定调（宏观与流动性水位）
  - 结合大盘整体趋势（上证/创业板/恒生科技与 MA20/MA60 位置关系）以及全市场成交量能。
  - 输出明确的仓位建议系数：
    - 多头进攻（放量突破、均线多头）：建议总仓位 60% ~ 80%
    - 震荡轮动（缩量分化、箱体震荡）：建议总仓位 30% ~ 50%，以低吸防守为主
    - 空头退潮（跌破均线、放量下跌）：建议总仓位 < 20% 或空仓观望

  ### Step 2: 主线板块与行业轮动定位
  - 使用 `get_sector_rankings` 查看当前标的所处行业/ETF板块的资金强度与走势排名。
  - 明确标的所处生命周期：
    - 启动期 / 确认期：值得重点建仓试错；
    - 主升加速期：持有享受利润，不盲目追高；
    - 滞涨分化 / 退潮期：减仓或触发止盈。

  ### Step 3: 标的交易计划（必须输出明确的量化 IF-THEN 条件单）
  针对本标的，使用 `analyze_trend` 与 `get_daily_history` 进行量价均线研判，在报告中强制输出：
  1. **趋势研判**：MA5/MA10/MA20 排列状态、量价健康度、乖离率（Bias）。
  2. **买入触发条件（IF-THEN）**：
     - 若作为观察标的：给出具体的买入触发逻辑（如“盘中有效突破某价位并放量”、“回踩 MA10/MA20 企稳收阳”）。
     - **买入参考区间**：给出明确的区间价格（如 15.20 ~ 15.50 元）。
  3. **硬性止损价（Stop Loss）**：
     - 必须给出确切价格（跌破关键支撑位或亏损达 4%~6% 坚决离场），绝不抗单。
  4. **第一目标位与盈亏比（Target & R:R）**：
     - 目标位必须保证盈亏比至少达到 2:1 以上。

  ### Step 4: 现有持仓风控跟踪（针对已有仓位：159611、159652、589120、601168、002415）
  - 对照成本价输出当前真实浮动盈亏，明确：
    - **移动止盈线（Trailing Stop）**：随着价格创出新高，将防守线顺移至 MA5 或前一波低点，确保利润不回吐。
    - **防守减仓信号**：跌破关键均线减半仓，跌破止损位清仓保护本金。

  评分与决策标签调整建议：
  - 符合主线 + 均线多头 + 缩量回踩 MA10/MA20 企稳：`sentiment_score +15`，标为【买入/建仓】
  - 放量突破关键阻力位且大盘配合：`sentiment_score +12`，标为【追随/加仓】
  - 乖离率过大（偏离 MA20 > 10%）或高位放量长上影：`sentiment_score -8`，标为【暂不追高/谨慎】
  - 破位跌破 MA20 且无法收复：`sentiment_score -15`，标为【止损/离场】
